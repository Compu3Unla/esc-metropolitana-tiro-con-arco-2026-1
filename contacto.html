<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escuela Metropolitana de Tiro con Arco</title>
    <link href="estilos.css" rel="stylesheet" type="text/css">
    <link rel="icon" href="imgemta/favicon.svg" type="image/x-icon" width="80" height="80">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&display=swap');
    </style>
</head>

<body id="bodyfondo">
    <header>
        <nav>
            <a href="index.html">
                <img src="imgemta/botones/boton-inicio.svg" alt="boton para volver al inicio">
            </a>
        </nav>
    </header>

    <main id="maincontacto">
        <section id="infocontenedor">
            <article class="datos">
                <div>
                    <h3>NÚMERO DE CONTACTO</h3>
                    <p>11-4973-2696</p>
                </div>

                <div>
                    <h3>UBICACIÓN</h3>
                    <p>Av. Juan Bautista Justo 5450, CABA</p>
                </div>
                <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3283.5377948455366!2d-58.473413699999995!3d-34.6158475!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x95bcca157abb4493%3A0x478bb5cc53704a45!2sArqueria%20EMTA%20Escuela%20Metropolitana%20de%20Tiro%20con%20Arco!5e0!3m2!1ses!2sar!4v1781326017553!5m2!1ses!2sar" width="453" height="384" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
            </article>

            <form method="post" target="_blank" enctype="text/plain">
                <div>
                    <label for="nombre">NOMBRE</label>
                    <input type="text" name="nombre" id="nombre" maxlength="30" placeholder="Mi nombre es...">
                </div>
                <div>
                    <label for="mail">MAIL</label>
                    <input type="text" name="mail" id="mail" maxlength="60" placeholder="Ej: emta@gmail.com">
                </div>
                <div>
                    <label for="mensaje">MENSAJE</label>
                    <textarea name="mensaje" id="mensaje" placeholder="Buen día..."></textarea>
                </div>
                <input type="submit" name="enviar" id="enviar" formenctype="multipart/form-data" value="ENVIAR">
            </form>
        </section>
    </main>

<footer>
    <div class="bloque">
        <div class="info-footer">
            <img src="imgemta/logotipo_footer.svg" alt="logotipo de la escuela" width="175" height="56">
            <div>
                <p>Somos un club de tiro con arco.</p>
                <p>Nuestros instructores estan habilitados por FATARCO.</p>
                <p>Proveemos todo el material necesitado para la práctica.</p>
            </div>
        </div>
        <div class="redes">
            <a href="" target="_blank">
                <img src="imgemta/redes/fb.svg" alt="link al facebook de EMTA" width="50" height="50"></a>
            <a href="" target="_blank">
                <img src="imgemta/redes/yt.svg" alt="link al youtube de EMTA" width="50" height="50"></a>
            <a href="" target="_blank">
                <img src="imgemta/redes/ig.svg" alt="link al instagram de EMTA" width="50" height="50"></a>
        </div>
    </div>
</footer>
</body>
</html>
