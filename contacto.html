<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escuela Metropolitana de Tiro con Arco</title>
    <link href="estilos.css" rel="stylesheet" type="text/css">
    <link rel="icon" href="" type="">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&display=swap');
    </style>
</head>

<body id="bodycontacto">
    <header>
        <section id="headcontenedor">
            <a href="index.html">
                <p>INICIO</p>
            </a>
        </section>
    </header>

    <main class="maincontacto">
        <section id="infocontenedor">
            <article class="datos">
                <div>
                    <h1>NÚMERO DE CONTACTO</h1>
                    <p>11-4973-2696</p>
                </div>

                <div>
                    <h1>UBICACIÓN</h1>
                    <p>Av. Juan Bautista Justo 5450, CABA</p>
                </div>

                <a href="https://maps.app.goo.gl/DJ5uQwnxowHHSLb98">
                    <img src="imgemta/mapa.jpg" alt="mapa de donde se escuentra la escuela de arco">
                </a>

            </article>

            <div class="costado">
                <article class="formulario">
                    <form method="post" target="_blank" enctype="text/plain">
                        <label for="nombre">NOMBRE</label>
                        <input type="text" name="nombre" id="nombre" maxlength="30" placeholder="Mi nombre es...">

                        <label for="mail">MAIL</label>
                        <input type="text" name="mail" id="mail" maxlength="60" placeholder="Ej: emta@gmail.com">

                        <label for="mensaje">MENSAJE</label>
                        <textarea name="mensaje" id="mensaje" placeholder="Buen día..."></textarea>
                    </form>
                </article>
            
                <article class="botonenviar">
                    <div>
                        <p>ENVIAR</p>
                    </div>
                </article>
            </div>
        </section>
    </main>
    
    

</body>

</html>
